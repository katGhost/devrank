{% extends 'base.html' %}

{% block content %}
<div class="post-creation-overlay">
    <div class="input-container">
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('forum.new_post') }}">
                <div class="mb-3">
                    <input
                        type="text"
                        class="form-control"
                        id="postTitle"
                        name="title"
                        maxlength="255"
                        placeholder="What's your cry?"
                        required
                    >
                </div>
                <div class="mb-3">
                    <input
                        type="text"
                        class="form-control"
                        id="postForum"
                        name="title"
                        maxlength="100"
                        placeholder="forum"
                        required
                    >
                </div>
                <div class="mb-4">
                    <textarea
                        class="form-control"
                        id="postDescription"
                        name="description"
                        rows="5"
                        placeholder="Describe your cry. What have you tried to fix the problem?"
                        required
                    ></textarea>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-create-post">Create Post</button>
                    <a href="#" class="btn btn-cancel-post">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
